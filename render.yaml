services:
  - type: web
    name: studio-management-backend
    env: node
    plan: free
    branch: main
    root: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: "https://your-frontend-url.example"
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: MONGO_URI
        fromSecret: MONGO_URI
      - key: ADMIN_KEY
        fromSecret: ADMIN_KEY
      - key: STRIPE_SECRET_KEY
        fromSecret: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        fromSecret: STRIPE_WEBHOOK_SECRET
      - key: CLOUDINARY_CLOUD_NAME
        fromSecret: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromSecret: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromSecret: CLOUDINARY_API_SECRET

  - type: web
    name: studio-management-frontend
    env: node
    plan: free
    branch: main
    root: client
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: "https://your-backend-url.example/api"
